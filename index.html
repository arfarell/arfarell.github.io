<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>arfarell</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #0b0f17;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    main {
      text-align: center;
      padding: 24px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 20px;
      font-size: 14px;
      color: #94a3b8;
    }
    a {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      transition: border-color 0.15s, color 0.15s;
    }
    a:hover {
      border-color: #38bdf8;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <main>
    <h1>@arfarell</h1>
    <p>Personal space.</p>
    <a href="https://github.com/arfarell" target="_blank" rel="noopener">GitHub</a>
  </main>
</body>
</html>
